<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUB-LAB</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="images/icons/gub.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap" rel="stylesheet">

  <meta name="description"
    content="GUB-LAB est un portfolio présentant une sélection de travaux visuels, expérimentations et projets personnels.">

  <script src="grab.js" defer></script>
  <script src="heure.js" defer></script>
</head>

<body>
  <header>
    <img id="logo" class="tournable" src="images/icons/logo transparent.svg" alt="Accueil" width="67">
    <nav class="liste">
      <ul>
        <li class="noir anim-texte"><a href="/">ACCUEIL</a><img class="tournable" src="images/icons/icon accueil.svg"
            alt="icon accueil">
        </li>
        <li class="violet anim-texte"><a href="graphisme.html">GRAPHISME</a><img class="tournable"
            src="images/icons/icon graphisme.svg" alt="icon graphisme">
        </li>
      </ul>
    </nav>
  </header>
  <main>
    <div class="galerie">
      <img src="images/affiche-semi.webp" alt="Affiche semi marathon" fetchpriority=high
        onclick="document.getElementById('desc').textContent = 'Affiche du semi marathon de Plouguin, création de l\'identité graphique de l\'évènement et de plusieurs éléments graphique (affiche, plan des courses, logo).'">
      <img src="images/affiche-rando.webp" alt="Affiche rando vtt"
        onclick="document.getElementById('desc').textContent = 'Affiche de la rando VTT de Plouguin'">
      <video src="images/gobelin.webm" autoplay muted loop playsinline
        onclick="document.getElementById('desc').textContent = 'Petit projet en suspens de marque de vêtement GobelinGobelin autour de l\'escalade, avec la mise en place d\'un shop sur Etsy et l\'impression des t-shirts sur Printify.'"></video>
    </div>

    <div class="boite-desc" contenteditable="true" spellcheck="false">
      <p id="desc">
        <u>Logiciels</u>: Illustrator, Photoshop
      </p>

    </div>


  </main>
  <footer>

    <div class="contact">
      <span><a href="mailto:gublab01@gmail.com">gublab01@gmail.com</a></span>
    </div>

    <div id="heure">
      <span id="heures">00</span>
      <span class="points">:</span>
      <span id="minutes">00</span>
    </div>

    <div class="info">
      <span>sur <a href="https://github.com/gub-lab/portfolio">Github Pages</a></span>
    </div>

  </footer>

</body>

</html>
